<div class="shell">
  <nav id="nav" class="nav" aria-label="Main"></nav>

  <div class="content">
    <header class="top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg class="i"><use href="#i-pill"/></svg></span>
        <span class="brand-name">MedAssist</span>
      </div>
      <button class="tool tool-sos" id="btnSos" type="button"><svg class="i" aria-hidden="true"><use href="#i-phone"/></svg><span id="sosText"></span></button>
      <div class="tools" role="toolbar" aria-label="Quick settings">
        <label class="lang"><span class="sr" id="langLabel">Language</span>
          <select id="lang" aria-labelledby="langLabel">
            <option value="en">English</option>
            <option value="ur">اردو</option>
            <option value="sd">سنڌي</option>
          </select>
        </label>
        <button class="tool" id="btnSize" type="button"><svg class="i" aria-hidden="true"><use href="#i-type"/></svg><span class="sr"></span></button>
        <button class="tool" id="btnTheme" type="button"><svg class="i" aria-hidden="true"><use href="#i-moon"/></svg><span class="sr"></span></button>
        <button class="tool" id="btnHelp" type="button"><svg class="i" aria-hidden="true"><use href="#i-help"/></svg><span class="sr"></span></button>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <aside id="disc" class="disc" aria-label="Safety note"></aside>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="overlay" class="overlay" hidden></div>

<script src="js/core.js"></script>
<script src="js/parser.js"></script>
<script src="js/i18n.js"></script>
<script src="js/speech.js"></script>
<script src="js/app.js"></script>

</html>
